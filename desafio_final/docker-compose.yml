services:
  postgres:
    image: postgres:15
    container_name: leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       leads_db
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - leads-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d leads_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4
    container_name: leads-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@leads.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - leads-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: leads-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    ports:
      - "2181:2181"
    networks:
      - leads-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: leads-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID:                                1
      KAFKA_ZOOKEEPER_CONNECT:                        zookeeper:2181
      KAFKA_LISTENERS:                                PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:                     PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:         1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:            1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:         0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                "true"
    ports:
      - "9092:9092"
    networks:
      - leads-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: leads-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME:             local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER:        zookeeper:2181
    ports:
      - "8081:8080"
    networks:
      - leads-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL:                          jdbc:postgresql://postgres:5432/leads_db
      DB_USERNAME:                     admin
      DB_PASSWORD:                     admin
      KAFKA_BOOTSTRAP_SERVERS:         kafka:9092
      APP_UPLOAD_DIRETORIO_TEMPORARIO: /tmp/leads-uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - uploads_data:/tmp/leads-uploads
    networks:
      - leads-network

networks:
  leads-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data: